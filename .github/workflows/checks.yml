name: checks

# SECURITY: pull_request_target — never execute code from pr/. Only read files.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # pull_request_target's default ref is the base branch: trusted code only.
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: _base
          persist-credentials: false

      # The PR head is data, never executed. Fetched without credentials and
      # checked out with hooks disabled; nothing from pr/ is ever run.
      - name: Fetch PR head (data only)
        run: |
          git init -q pr
          git -C pr fetch --no-tags https://github.com/${{ github.repository }} +refs/pull/${{ github.event.pull_request.number }}/head:refs/pr/head ${{ github.event.pull_request.base.sha }}
          git -C pr -c core.hooksPath=/dev/null checkout -q --detach refs/pr/head

      # Checks always run the base branch's copy, never the PR's.
      - name: Run PR checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _base/tools/ci/pr_checks.py pr

      - name: Run CI unit tests
        run: python3 -m unittest discover -s _base/tests/ci -t _base
