name: claim

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  issues: write

jobs:
  claim:
    # Filter first so an ordinary comment can't cancel a queued /claim run.
    if: github.event_name == 'schedule' || contains(github.event.comment.body, '/claim') || contains(github.event.comment.body, '/unclaim')
    # One claim job per issue; the schedule run shares the 'schedule' group.
    concurrency:
      group: claim-${{ github.event.issue.number || 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      # Default branch only; PR code is never checked out here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Process claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci/claims.py
